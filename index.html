    <div id="navbar">
        <img class="navitem" id="logo" alt="swords" src="gamepad.png">

        <input aria-label="search games in inventory" id="searchbar" label="search">
        <button onclick="hide()" id="search" class="navitem" type="button">⌕</button>

        <h1>Add Game</h1>

        <input id="gamename">
        <label for="platform">Platform</label>
        <input id="platform">
        <div>
        <label for="digital">Digital</label>
        <input type="radio" id="digital">
        <label for="physical">Physical</label>
        <input type="radio" id="physical">
        </div>
        <div id="formbuttons">
        <button id="submit" type="submit">Submit</button>
        <button onclick="closepopup()" id="close" type="button">close</button>
        </div>
